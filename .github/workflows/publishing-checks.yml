name: Publishing checks

on:
  pull_request:
    paths: ['.github/workflows/**', 'tools/publishing/**', 'docs/curseforge/**', 'docs/branding/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'tools/publishing/**', 'docs/curseforge/**', 'docs/branding/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/publishing -p 'test_*.py' -v
